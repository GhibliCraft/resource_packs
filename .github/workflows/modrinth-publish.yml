name: Publish to Modrinth

on:
  release:
    types: [published]

jobs:
  modrinth:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - world: european
            title: European
            project: RzPozVu4
          - world: japanese
            title: Japanese
            project: dMMAn617
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # tags v<minecraft version>-<pack number>, e.g. v26.3-8
      - id: mc
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          echo "version=${tag%-*}" >> "$GITHUB_OUTPUT"

      # merge Base into both
      - run: |
          mkdir -p out/pack
          cp -r resource-packs/base/. resource-packs/${{ matrix.world }}/. out/pack/
          cd out/pack && zip -qr9 "../GhibliCraft-${{ matrix.title }}-${{ github.event.release.tag_name }}.zip" .

      - uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ matrix.project }}
          name: ${{ matrix.title }} ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          loaders: minecraft
          game-versions: ${{ steps.mc.outputs.version }}
          files: out/GhibliCraft-${{ matrix.title }}-${{ github.event.release.tag_name }}.zip
